name: Timecard smoke checks
on:
  push:
    branches: [main, timecard-rebuild]
  pull_request:
    branches: [main, timecard-rebuild]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
